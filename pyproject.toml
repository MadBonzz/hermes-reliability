[project]
name = "hermes-reliability"
version = "0.1.0"
description = "Hermes plugin for evidence-based agent reliability campaigns"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema>=4.18,<5",
    "fastapi>=0.104,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "dashboard/*.py", "__init__.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Direct CLI entry points add the project root before importing src modules.
"src/evaluation/check_hermes_integration.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
