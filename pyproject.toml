[project]
name = "hermes-eval-harness"
version = "0.1.0"
description = "Declarative multi-turn evaluations for a separately installed Hermes agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema>=4.18,<5",
    # Match the separately installed Hermes runtime's pinned dependency.
    "python-dotenv==1.2.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Direct CLI entry points add the project root before importing src modules.
"src/eval_runner.py" = ["E402"]
"src/check_hermes_integration.py" = ["E402"]
"src/correlate_lmstudio_logs.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
